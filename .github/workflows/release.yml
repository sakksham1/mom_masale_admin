name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v1.0.0 triggers a release

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'   # matches your pubspec's flutter sdk constraint
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI, smaller downloads)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs for clarity
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/mom-masale-admin-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/mom-masale-admin-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/mom-masale-admin-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-artifacts/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mom-masale-admin-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: mom-masale-admin-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apks/*.apk
            artifacts/windows-build/*.zip
          generate_release_notes: true